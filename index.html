<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BAZARINO | بازارینو شاپ</title>
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="header-deco"></div>
  <div class="container header-top">
    <div class="brand">
      <img src="assets/logo.png" alt="Bazarino Logo">
      <div class="brand-text">
        <h1>BAZARINO</h1>
        <span>bazarinoshop</span>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <button class="contact-btn" id="contactBtn">تماس با ما</button>
      <button class="menu-toggle" id="menuToggle">☰</button>
    </div>
  </div>
</header>

<main class="container main-layout">

  <!-- ستون راست: منوی کرکره‌ای دسته‌بندی -->
  <aside class="col-menu">
    <div class="menu-box" id="menuBox">
      <h3>دسته‌بندی‌ها</h3>
      <ul id="menuAccordion" style="list-style:none;padding:6px 0"></ul>
    </div>
  </aside>

  <!-- ستون وسط: محصولات -->
  <section class="center-col">
    <h2 class="section-title">محصولات</h2>
    <div class="products-grid" id="productsGrid"></div>
    <div class="pagination" id="pagination"></div>
  </section>

  <!-- ستون چپ: تبلیغات + مطالب جدید -->
  <aside class="col-ads">
    <div class="news-slider">
      <h3>مطالب جدید</h3>
      <div class="news-track" id="newsTrack"></div>
    </div>
    <div class="ad-slot" id="ad1">جای تبلیغات ۱</div>
    <div class="ad-slot" id="ad2">جای تبلیغات ۲</div>
    <div class="ad-slot" id="ad3">جای تبلیغات ۳</div>
  </aside>

</main>

<footer class="site-footer">
  <div>© BAZARINO ONLINE SHOP — bazarinoshop</div>
  <div class="socials">
    <a href="https://t.me/pbazarinoshop1" target="_blank">تلگرام</a>
    <a href="https://rubika.ir/shopbazarino" target="_blank">روبیکا</a>
    <a href="https://ble.ir/shopbazarino" target="_blank">بله</a>
  </div>
</footer>

<!-- مودال تماس با ما -->
<div class="modal-overlay" id="contactModal">
  <div class="modal-box">
    <button class="modal-close" data-close>×</button>
    <h3>تماس با ما</h3>
    <div id="contactBody" style="color:var(--text-dim);text-align:center"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/main.js"></script>
</body>
</html>
