<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدیریت</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  body{background:var(--bg-2)}
  .admin-wrap{max-width:1100px;margin:0 auto;padding:20px}
  .login-box{max-width:360px;margin:80px auto;background:var(--bg-card);
    border:1px solid var(--gold-dark);border-radius:var(--radius);padding:30px;box-shadow:var(--shadow)}
  .login-box h2{color:var(--gold);text-align:center;margin-bottom:20px}
  .field{margin-bottom:14px}
  .field label{display:block;margin-bottom:6px;color:var(--text-dim);font-size:.85rem}
  .field input,.field select,.field textarea{
    width:100%;padding:10px;border-radius:8px;border:1px solid #333;
    background:#0f0f12;color:var(--text);font-family:inherit;
  }
  .btn{background:linear-gradient(135deg,var(--gold-light),var(--gold-dark));color:#1a1405;
    font-weight:800;padding:11px;border-radius:8px;width:100%}
  .btn-sm{padding:6px 14px;border-radius:6px;font-size:.8rem;background:var(--gold-dark);color:#fff}
  .btn-danger{background:#b23b3b;color:#fff}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;border-bottom:1px solid #2a2a2e;padding-bottom:10px}
  .tab-btn{background:var(--bg-card);color:var(--text-dim);padding:9px 16px;border-radius:8px;font-size:.88rem}
  .tab-btn.active{background:var(--gold);color:#1a1405;font-weight:700}
  .panel{display:none;background:var(--bg-card);border:1px solid #2a2a2e;border-radius:var(--radius);padding:20px}
  .panel.active{display:block}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row>*{flex:1;min-width:140px}
  table{width:100%;border-collapse:collapse;margin-top:14px;font-size:.85rem}
  th,td{padding:8px;border-bottom:1px solid #2a2a2e;text-align:right}
  .stat-cards{display:flex;gap:14px;flex-wrap:wrap}
  .stat-card{background:var(--bg-2);border:1px solid var(--gold-dark);border-radius:10px;
    padding:18px 24px;text-align:center;min-width:140px}
  .stat-card .num{font-size:1.8rem;color:var(--gold);font-weight:800}
  .chip-input{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
  .chip{background:var(--gold-dark);color:#fff;padding:4px 10px;border-radius:14px;font-size:.78rem;display:flex;gap:6px;align-items:center}
  .chip span{cursor:pointer}
  .img-thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .img-thumbs img{width:60px;height:60px;object-fit:cover;border-radius:6px;border:1px solid var(--gold-dark)}
  .upload-progress{font-size:.8rem;color:var(--gold-light)}
  .msg-box{padding:10px;border-radius:8px;margin-bottom:12px;font-size:.85rem}
  .msg-ok{background:#1e3b1e;color:#9fe29f}
  .msg-err{background:#3b1e1e;color:#e29f9f}
</style>
</head>
<body>

<!-- ===== صفحه ورود ===== -->
<div id="loginScreen" class="login-box">
  <h2>ورود به پنل مدیریت</h2>
  <div id="loginMsg"></div>
  <div class="field"><label>ایمیل</label><input type="email" id="loginEmail"></div>
  <div class="field"><label>رمز عبور</label><input type="password" id="loginPass"></div>
  <button class="btn" id="loginBtn">ورود</button>
</div>

<!-- ===== داشبورد ===== -->
<div id="dashboard" class="admin-wrap" style="display:none">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <h2 style="color:var(--gold)">پنل مدیریت بازارینو</h2>
    <button class="btn-sm" id="logoutBtn">خروج</button>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="products">محصولات</button>
    <button class="tab-btn" data-tab="categories">دسته‌بندی‌ها</button>
    <button class="tab-btn" data-tab="banners">تبلیغات</button>
    <button class="tab-btn" data-tab="news">مطالب جدید</button>
    <button class="tab-btn" data-tab="contact">تماس با ما</button>
    <button class="tab-btn" data-tab="stats">آمار</button>
  </div>

  <!-- محصولات -->
  <div class="panel active" id="tab-products">
    <h3>افزودن محصول جدید</h3>
    <div class="row">
      <div class="field"><label>نام محصول</label><input id="pName"></div>
      <div class="field"><label>دسته‌بندی</label><select id="pCategory"></select></div>
    </div>
    <div class="row">
      <div class="field"><label>قیمت (تومان)</label><input type="number" id="pPrice"></div>
      <div class="field"><label>موجودی (تعداد)</label><input type="number" id="pStock"></div>
      <div class="field"><label>نوع نمایش گالری</label>
        <select id="pGalleryStyle"><option value="slider">اسلایدی</option><option value="reel">ریلی (اسکرول)</option></select>
      </div>
    </div>
    <div class="field">
      <label>رنگ‌بندی (هر رنگ را تایپ کن و Enter بزن)</label>
      <input id="pColorInput" placeholder="مثلا: مشکی">
      <div class="chip-input" id="pColorChips"></div>
    </div>
    <div class="field">
      <label>سایزبندی (هر سایز را تایپ کن و Enter بزن)</label>
      <input id="pSizeInput" placeholder="مثلا: 38">
      <div class="chip-input" id="pSizeChips"></div>
    </div>
    <div class="field">
      <label>عکس‌های محصول (می‌تونی چند تا انتخاب کنی)</label>
      <input type="file" id="pImages" accept="image/*" multiple>
      <div class="upload-progress" id="uploadProgress"></div>
      <div class="img-thumbs" id="imgThumbs"></div>
    </div>
    <div id="productMsg"></div>
    <button class="btn" id="saveProductBtn">ثبت محصول در شاخه انتخاب‌شده</button>

    <h3 style="margin-top:28px">لیست محصولات</h3>
    <table><thead><tr><th>عکس</th><th>نام</th><th>دسته</th><th>قیمت</th><th>موجودی</th><th></th></tr></thead>
    <tbody id="productsTable"></tbody></table>
  </div>

  <!-- دسته‌بندی‌ها -->
  <div class="panel" id="tab-categories">
    <h3>افزودن شاخه جدید</h3>
    <div class="row">
      <input id="catName" placeholder="مثلا: مجلسی">
      <button class="btn" id="addCatBtn" style="max-width:160px">افزودن شاخه</button>
    </div>
    <table><thead><tr><th>نام شاخه</th><th>ترتیب</th><th></th></tr></thead>
    <tbody id="categoriesTable"></tbody></table>
  </div>

  <!-- تبلیغات -->
  <div class="panel" id="tab-banners">
    <h3>مدیریت ۳ جای تبلیغات (ستون چپ صفحه اصلی)</h3>
    <div id="bannersForm"></div>
  </div>

  <!-- مطالب جدید -->
  <div class="panel" id="tab-news">
    <h3>اسلاید‌های مطالب جدید</h3>
    <div class="row">
      <input id="newsTitle" placeholder="عنوان مطلب">
      <input type="file" id="newsImage" accept="image/*">
      <button class="btn" id="addNewsBtn" style="max-width:160px">افزودن اسلاید</button>
    </div>
    <div id="newsList" style="margin-top:14px"></div>
  </div>

  <!-- تماس با ما -->
  <div class="panel" id="tab-contact">
    <h3>متن صفحه تماس با ما</h3>
    <textarea id="contactText" rows="6" placeholder="شماره تماس، آیدی تلگرام، آدرس و..."></textarea>
    <button class="btn" id="saveContactBtn" style="margin-top:10px">ذخیره</button>
  </div>

  <!-- آمار -->
  <div class="panel" id="tab-stats">
    <h3>آمار سایت</h3>
    <div class="stat-cards">
      <div class="stat-card"><div class="num" id="statVisits">۰</div><div>تعداد بازدید</div></div>
      <div class="stat-card"><div class="num" id="statUsers">۰</div><div>کاربران منحصر به فرد</div></div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
